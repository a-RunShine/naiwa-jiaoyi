server:
  port: 8080

spring:
  application:
    name: naiwa-market
  datasource:
    # 本地直连 docker 中的 MySQL,容器名解析走 host.docker.internal
    # 容器内跑后端时由 SPRING_DATASOURCE_URL 环境变量覆盖为 mysql:3306
    url: ${SPRING_DATASOURCE_URL:jdbc:mysql://localhost:3306/naiwa_market?useUnicode=true&characterEncoding=utf8&serverTimezone=Asia/Shanghai&allowPublicKeyRetrieval=true&useSSL=false}
    username: ${SPRING_DATASOURCE_USERNAME:naiwa}
    password: ${SPRING_DATASOURCE_PASSWORD:${DB_PASSWORD:naiwa_dev}}
    driver-class-name: com.mysql.cj.jdbc.Driver
  servlet:
    multipart:
      max-file-size: 5MB
      max-request-size: 50MB

mybatis-plus:
  configuration:
    map-underscore-to-camel-case: true
  global-config:
    db-config:
      id-type: ASSIGN_ID

springdoc:
  swagger-ui:
    path: /swagger-ui.html
  api-docs:
    path: /v3/api-docs

app:
  jwt:
    secret: ${JWT_SECRET:dev-secret-key-must-be-at-least-32-bytes-long-xxxx}
    expire-hours: 720
  wechat:
    app-id: ${WX_APPID:your_appid_here}
    app-secret: ${WX_APP_SECRET:your_secret_here}
    cloud-env: ${WX_CLOUD_ENV:your-cloud-env-id}
    api-base: https://api.weixin.qq.com
  mock:
    enabled: true
  file-storage:
    dir: ${FILE_DIR:./uploads}
    base-url: ${FILE_BASE_URL:http://localhost:8080}